name: build-no-clipboard
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
jobs:
  build:
    name: build
    strategy:
      matrix:
        platform:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest,  target: x86_64-apple-darwin      }
    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}
      - name: Build
        run: cargo build --verbose --release --no-default-features --target=${{ matrix.platform.target }}
      - name: Strip binary
        run: strip target/${{ matrix.platform.target }}/release/jless
      - name: Compress binary
        run: |
          mv target/${{ matrix.platform.target }}/release/jless .
          zip -X jless-no-clipboard-${{ matrix.platform.target }}.zip jless
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jless-no-clipboard-${{ matrix.platform.target }}.zip
          path: jless-no-clipboard-${{ matrix.platform.target }}.zip
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: jless-no-clipboard-${{ matrix.platform.target }}.zip
