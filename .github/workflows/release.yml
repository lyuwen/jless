name: release
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-all:
    name: build-all
    strategy:
      matrix:
        platform:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest,  target: x86_64-apple-darwin      }
        variant:
          - { name: "", features: "", deps: "libxcb-shape0-dev libxcb-xfixes0-dev" }
          - { name: "-no-clipboard", features: "--no-default-features", deps: "" }
    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}
      - name: Install clipboard dependencies
        if: matrix.platform.os == 'ubuntu-latest' && matrix.variant.deps != ''
        run: sudo apt install -y ${{ matrix.variant.deps }}
      - name: Build
        run: cargo build --verbose --release ${{ matrix.variant.features }} --target=${{ matrix.platform.target }}
      - name: Strip binary
        run: strip target/${{ matrix.platform.target }}/release/jless
      - name: Compress binary
        run: |
          mv target/${{ matrix.platform.target }}/release/jless .
          zip -X jless${{ matrix.variant.name }}-${{ matrix.platform.target }}.zip jless
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jless${{ matrix.variant.name }}-${{ matrix.platform.target }}.zip
          path: jless${{ matrix.variant.name }}-${{ matrix.platform.target }}.zip
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: jless${{ matrix.variant.name }}-${{ matrix.platform.target }}.zip
